      width_y_m: 0.17
      height_z_m: 0.145
    - x_m: -0.04
      width_y_m: 0.165
      height_z_m: 0.145
    - x_m: -0.1
      width_y_m: 0.145
      height_z_m: 0.132
    - x_m: -0.145
      width_y_m: 0.12
      height_z_m: 0.112
    - x_m: -0.181
      width_y_m: 0.1
      height_z_m: 0.1
    displaced_volume_m3:
      status: provisional_until_closed_physics_OBJ_is_generated
      estimate: 0.005150034
      method: trapezoidal integration of elliptical section areas
    mass_kg:
      status: provisional_until_all_link_volumes_and_inertias_are_generated
      initial_total_vehicle_target_from_body_only_estimate: 5.0837
      warning: Do not use as final vehicle mass; tail/fins/link masses must be included first.
    center_of_mass_body_xyz_m:
      status: initial_stability_target
      value:
      - 0.0
      - 0.0
      - 0.02
      meaning: COM target 20 mm below COB in NED +Z
    center_of_buoyancy_body_xyz_m:
      status: initial_stability_target
      value:
      - 0.0
      - 0.0
      - 0.0
      meaning: Initial geometric center target; recompute from closed submerged meshes.
    visual_style: smooth streamlined closed OBJ
    physics_style: simplified closed low-poly OBJ with same wetted envelope
  tail:
    provenance: project_decision_using_fishsim_reference
    segment_count: 5
    use_fishsim_segment_lengths_and_taper_as_initial_reference: true
    use_single_active_tail_motor: true
    use_passive_compliant_tail: true
    target_passive_natural_frequency_hz: 3.5
    target_tendon_routing:
    - 0
