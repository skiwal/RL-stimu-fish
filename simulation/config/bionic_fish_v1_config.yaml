      - -0.101476
      local_bbox_max_xyz_m:
      - 0.06537
      - 0.001
      - 0.101476
      bbox_dimensions_xyz_m:
      - 0.059816
      - 0.002
      - 0.202952
      fishsim_mesh_origin_x_m:
        value: 0.417
        provenance: source_derived
      approximate_global_x_extent_m:
        value:
        - 0.422554
        - 0.48237
