        structural_support_crossbar_full_x_m: 0.006
        structural_support_crossbar_full_z_m: 0.014
        tendon_site_y_m:
        - -0.015
        - 0.015
      tail4:
        main_spine_full_dimensions_xyz_m:
        - 0.015
        - 0.003
        - 0.08
        structural_support_full_width_y_m: 0.02
        structural_support_crossbar_full_x_m: 0.006
        structural_support_crossbar_full_z_m: 0.014
        tendon_site_y_m:
        - -0.005
        - 0.005
    routing:
      left_tendon:
        tail0: left
        tail1: left
        tail2: left
        tail3: right
        tail4: right
      right_tendon:
        tail0: right
        tail1: right
        tail2: right
        tail3: left
        tail4: left
      description: antagonistic S-bend tendon routing
  existing_meshes:
    caudal_fin:
      provenance: source_derived_from_finTail_obj
      source_file: Geometry/Meshes/finTail.obj
      mass_kg_in_fishsim: 0.01
      local_bbox_min_xyz_m:
      - 0.005554
