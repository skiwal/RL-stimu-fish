schema_version: 1
config_name: BionicFishV1Config
config_revision: 0.2.1
snapshot_date: '2026-08-16'
project:
  name: RL-stimu-fish
  simulator: Stonefish
  reference_robot_model: srl-ethz/fishsim
  reference_paper:
    title: 'Simple Models, Real Swimming: Digital Twins for Tendon-Driven Underwater Robots'
    arxiv_id: 2602.23283v1
    date: '2026-02-26'
units:
  length: m
  mass: kg
  density: kg/m^3
  dynamic_viscosity: Pa*s
  time: s
  frequency: Hz
  angle: rad unless explicitly marked deg
  angular_velocity: rad/s
  pressure: Pa
provenance_labels:
  source_exact: Copied directly from fishsim source code or paper.
  source_derived: Calculated from source geometry/transforms; not an explicit source scalar.
  project_decision: Design decision already agreed for RL-stimu-fish.
  project_tbd: Required by our model but not yet numerically frozen.
  reference_only: Useful calibration/reference value; must not be copied directly into Stonefish.
coordinate_frames:
  fishsim_reference:
    description: 'MuJoCo model frame used by fishsim. The generated model extends from the rigid front body toward the
      tail along increasing X. Paper marker preprocessing uses its own heading convention as well.

      '
    tail_chain_direction: +X
  stonefish_bionic_fish:
    provenance: project_decision
    frame: NED-compatible body convention
    x_positive: forward / head direction
    y_positive: fish right
    z_positive: down
    head_direction: +X
    tail_direction: -X
    note: 'Geometry imported/recreated from fishsim must be longitudinally re-oriented so that our sonar points +X and
      the tail extends toward -X.

      '
  fishsim_to_bionic_fish:
    provenance: source_derived_and_project_decision
    description: Port fishsim reference geometry into the project body frame by rotating 180 deg about Y and translating
      +0.104 m in X.
    rotation_rpy_rad:
    - 0.0
    - 3.141592653589793
    - 0.0
    translation_xyz_m:
    - 0.104
    - 0.0
    - 0.0
    mapping:
      x_bionic: 0.104 - x_fishsim
      y_bionic: y_fishsim
      z_bionic: -z_fishsim
    reference_points_m:
      fishsim_nose_x: -0.077
      fishsim_joint0_x: 0.285
      bionic_nose_x: 0.181
      bionic_joint0_x: -0.181
fishsim_reference:
  simulation:
    dt_s: 0.001
    fix_head: false
    free_z: false
    tendon_routing:
    - 0
    - 0
    - 0
    - 1
    - 1
    torque_control: false
    number_of_fish: 1
    bounds:
      status: not_used_in_reference_generator_by_default
      value: unbounded/default MuJoCo scene
    provenance:
      dt_s: source_exact
      fix_head: source_exact
      free_z: source_exact
      tendon_routing: source_exact
      torque_control: source_exact
      number_of_fish: source_exact
  default_head_constraints_when_free_z_false:
    provenance: source_exact
    translation_x:
      stiffness: 0.0
      damping: 0.0
    translation_y:
      stiffness: 0.0
      damping: 0.0
    translation_z:
      stiffness: 500.0
      damping: 10.0
    roll_x:
      stiffness: 10.0
      damping: 1.0
    pitch_y:
      stiffness: 10.0
      damping: 1.0
    yaw_z:
      stiffness: 0.0
      damping: 0.0
    note: 'These constraints reproduce fishsim''s surface-swimmer setup and MUST NOT be used for BionicFishV1. Our Stonefish
      fish is full 6-DOF.

      '
  mujoco_world:
    provenance: source_exact
    gravity_m_s2:
    - 0.0
    - 0.0
    - 0.0
    integrator: implicitfast
    solver: Newton
    iterations: 100
    contact_enabled: false
    note: 'These are reference-simulator settings, not Stonefish target settings.

      '
  fluid:
    provenance: source_exact
    shape: ellipsoid
    density_kg_m3: 1000.0
    dynamic_viscosity_pa_s: 0.0013
    identified_coefficients:
      blunt_drag: 0.4
      slender_drag: 7.79
      angular_drag: 2.81
      kutta_lift: 3.84
      magnus_lift: 0.27
    coefficient_vector:
    - 0.4
    - 7.79
    - 2.81
    - 3.84
    - 0.27
    transfer_to_stonefish: false
    transfer_note: 'These five coefficients belong to fishsim/MuJoCo''s stateless ellipsoid fluid formulation. Preserve
      them for validation/reference only.

      '
  materials_and_lumped_masses:
    provenance: source_exact
    acrylic_density_kg_m3: 1180.0
    pla_density_kg_m3: 1250.0
    electronics_box_mass_kg: 0.53
    main_body_mass_kg: 0.6
    tail_fin_mass_kg: 0.01
    head_attachment_mass_kg: 0.08
    motor_shaft_mass_kg: 0.05
  center_of_mass_seed:
    provenance: source_exact
    xyz_m:
    - 0.02456792
    - 0.0
    - 0.00080073
    note: 'auto_tendonFish.py recomputes this iteratively after generating the MuJoCo model. Treat this as a fishsim
      reference, not our final Stonefish COM.

      '
  hardware_bulk_envelope:
    provenance: source_exact
    length_m: 0.57
    height_m: 0.25
    width_m: 0.17
    note: Paper describes these as rough bulk dimensions of the physical robot.
  hardware_architecture:
    provenance: source_exact
    front_section: passive rigid front-end
    active_section: active compliant tendon-driven tail
    tail_spine_segment_count: 5
    main_motor:
      model: Dynamixel XW-540-T140-R
      waterproof: true
      dual_shaft: true
    tendon_count: 2
    tendon_material_description: fishing wire
    tendon_stretch_during_actuation_fraction_approx: 0.03
    nitinol_spine_rods:
      count: 4
      diameter_m: 0.001
    caudal_fin_nitinol_rods:
      count: 2
      orientation_description: vertical, perpendicular to the tail body
    structural_support_material: 3D-printed PLA
    waterproof_cover: resistant fabric over tail and part of body
    buoyancy_material: polyethylene foam
    electronics:
      computer: Raspberry Pi Zero
      motor_controller: Dynamixel U2D2
      battery: 3S LiPo
      power: DC-DC converter
  rigid_front_geometry:
    provenance: source_exact_with_full_dimensions_converted_from_mujoco_half_size
    head_vertical_plate:
      center_xyz_m:
      - 0.0
      - 0.0
      - 0.0
      full_dimensions_xyz_m:
      - 0.154
      - 0.005
      - 0.1
      material: acrylic
      density_kg_m3: 1180.0
      fluid_shape: ellipsoid
    head_top_plate:
      center_xyz_m:
      - 0.01
      - 0.0
      - 0.0515
      full_dimensions_xyz_m:
      - 0.16
      - 0.04
      - 0.003
      material: acrylic
      density_kg_m3: 1180.0
    electronics_box:
      center_xyz_m:
      - 0.005
      - 0.0
      - 0.083
      full_dimensions_xyz_m:
      - 0.12
      - 0.08
      - 0.06
      mass_kg: 0.53
    head_attachment:
      center_xyz_m:
      - 0.1
      - 0.0
      - 0.0
      full_dimensions_xyz_m:
      - 0.046
      - 0.03
      - 0.1
      mass_kg: 0.08
      fluid_shape: ellipsoid
    main_body:
      center_xyz_m:
      - 0.2005
      - 0.0
      - 0.0
      full_dimensions_xyz_m:
      - 0.155
      - 0.02
      - 0.105
      mass_kg: 0.6
      fluid_shape: ellipsoid
    body_to_joint0_connector:
      full_length_x_m: 0.007
      full_thickness_y_m: 0.001
      full_height_z_m: 0.075
      mass_kg: 0.001
      note: 'X length equals body-tail0 / 2 in the generated MuJoCo geometry.

        '
  tail_drive_motor:
    provenance: source_exact
    model: Dynamixel XW-540-T140-R
    joint:
      type: hinge
      axis_xyz:
      - 0.0
      - 1.0
      - 0.0
      fishsim_position_xyz_m:
      - 0.1655
      - 0.0
      - 0.0
      limited: false
      stiffness: 0.0
      damping: 0.0
    shaft:
      length_y_m: 0.12
      full_dimensions_xyz_m:
      - 0.015
      - 0.12
      - 0.015
      mass_kg: 0.05
    crank_arm:
      length_m: 0.0395
      measured_real_length_m_approx: 0.04
      full_cross_section_xy_m:
      - 0.015
      - 0.01
      material: PLA
      density_kg_m3: 1250.0
    left_tendon_anchor_local_xyz_m:
      value:
      - 0.0
      - -0.055
      - -0.0345
      provenance: source_derived
    right_tendon_anchor_local_xyz_m:
      value:
      - 0.0
      - 0.055
      - 0.0345
      provenance: source_derived
    tendon:
      count: 2
      routing_bits:
      - 0
      - 0
      - 0
      - 1
      - 1
      routing_semantics:
        '0': stay on the same side
        '1': cross to the opposite side
      stiffness: 20000.0
      damping: 10.0
      rendered_width_m: 0.001
      approximate_real_stretch_fraction: 0.03
    default_actuator:
      mode: velocity
      kv: 100.0
      control_limit_rad_s:
        min: -31.4
        max: 31.4
      equivalent_rotation_rate_limit_hz_approx: 5.0
      force_range_simulator_units:
      - -100.0
      - 100.0
      warning: 'force_range is a MuJoCo actuator clamp, NOT the real Dynamixel torque-speed specification and must not
        be copied as motor torque.

        '
  compliant_tail:
    provenance: source_exact_and_source_derived
    active_motor_count: 1
    rigid_spine_segment_count: 5
    hinge_joint_count: 5
    segment_nominal_length_m: 0.015
    joint_default:
      type: hinge
      axis_xyz:
      - 0.0
      - 0.0
      - 1.0
      range_deg:
      - -80.0
      - 80.0
      stiffness_mujoco: 0.65
      damping_mujoco: 0.0
    physical_validation_target:
      passive_tail_natural_frequency_hz: 3.5
      provenance: source_exact
      priority: 'Match this physical natural frequency in Stonefish rather than copying the raw MuJoCo stiffness scalar
        blindly.

        '
    spacing_m:
      body_to_tail0: 0.014
      tail0_to_tail1: 0.015
      tail1_to_tail2: 0.017
      tail2_to_tail3: 0.014
      tail3_to_tail4: 0.006
      tail4_to_caudal_fin: 0.01
    tendon_lateral_offset_m:
      tail0: 0.045
      tail1: 0.035
      tail2: 0.025
      tail3: 0.015
      tail4: 0.005
    fishsim_joint_absolute_x_m:
