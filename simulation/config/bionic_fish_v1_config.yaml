      joint0: 0.285
      joint1: 0.3145
      joint2: 0.3455
      joint3: 0.376
      joint4: 0.401
    fishsim_segment_center_absolute_x_m:
      provenance: source_derived
      tail0: 0.2995
      tail1: 0.3295
      tail2: 0.3615
      tail3: 0.3905
      tail4: 0.4115
    segments:
      tail0:
        main_spine_full_dimensions_xyz_m:
        - 0.015
        - 0.003
        - 0.1
        structural_support_full_width_y_m: 0.1
        structural_support_crossbar_full_x_m: 0.006
        structural_support_crossbar_full_z_m: 0.014
        tendon_site_y_m:
        - -0.045
        - 0.045
      tail1:
        main_spine_full_dimensions_xyz_m:
        - 0.015
        - 0.003
        - 0.095
