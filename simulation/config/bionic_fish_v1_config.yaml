    exact_stonefish_joint_damping:
      status: calibration_required
      initial_reference_value_from_fishsim: 0.0
      procedure: after stiffness calibration, fit free-decay envelope without shifting 3.5 Hz target materially
    note: 'Stonefish spring/damping values are to be calibrated so the free tail reproduces ~3.5 Hz natural oscillation.

      '
    geometry_frozen: true
    joint_axis_body_xyz:
